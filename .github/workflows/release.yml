name: Release

# Tag vN (v1, v2, ...) to publish the packs: a GitHub release holding every pack
# file and catalog.json, signed. raptaboard reads
# https://github.com/tuffinmuffin/raptaboard-content/releases/latest/download/catalog.json
#
# Tag vN-pre.M (any tag with a "-") to publish a pre-release catalog instead: a
# GitHub pre-release, signed the same, which may use pre-release sources
# (scripts/build_catalog.py). It never becomes "latest", so the released
# catalog stays as it was; raptaboard reads it only when told to.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover scripts
      - name: Build the catalog
        run: python3 scripts/build_catalog.py --tag "$GITHUB_REF_NAME" --out dist
      - name: Sign the catalog
        env:
          CONTENT_SIGNING_KEY: ${{ secrets.CONTENT_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$CONTENT_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          # Ed25519 over the file's bytes: a raw 64-byte signature.
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/signing.pem" \
            -in dist/catalog.json -out dist/catalog.json.sig
          rm "$RUNNER_TEMP/signing.pem"
      - name: The signature checks with the public key raptaboard has
        run: |
          # catalog-key.pub is the raw 32-byte key, base64; wrap it as a DER
          # SubjectPublicKeyInfo (the 12-byte Ed25519 prefix) for openssl.
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; base64 -d catalog-key.pub; } > "$RUNNER_TEMP/key.der"
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey "$RUNNER_TEMP/key.der" \
            -in dist/catalog.json -sigfile dist/catalog.json.sig
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # --verify-tag: fail at once, saying so, if the tag isn't on GitHub
          # (deleted or moved after it was pushed) rather than making a new one.
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${pre[@]}" \
            --title "Content $GITHUB_REF_NAME" \
            --notes "Packs: $(python3 -c "import json; print(', '.join(p['id'] + ' ' + p['version'] for p in json.load(open('dist/catalog.json'))['packs']))")"
      - name: The published catalog downloads and checks, as raptaboard reads it
        run: |
          # A release as "latest"; a pre-release (never latest) by its tag.
          case "$GITHUB_REF_NAME" in
            *-*) base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" ;;
            *) base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download" ;;
          esac
          mkdir check
          # The release can take a few minutes to become "latest" (v4 took
          # over a minute): try for up to five.
          for i in $(seq 1 30); do
            curl -sfL -o check/catalog.json "$base/catalog.json" \
              && curl -sfL -o check/catalog.json.sig "$base/catalog.json.sig" \
              && cmp -s check/catalog.json dist/catalog.json && break
            sleep 10
          done
          cmp dist/catalog.json check/catalog.json || {
            echo "::error::$base/catalog.json isn't this release's catalog"; exit 1; }
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey "$RUNNER_TEMP/key.der" \
            -in check/catalog.json -sigfile check/catalog.json.sig
          python3 - <<'PY'
          import hashlib, json, urllib.request
          for pack in json.load(open("check/catalog.json"))["packs"]:
              for f in pack["files"]:
                  data = urllib.request.urlopen(f["url"]).read()
                  ok = len(data) == f["size"] and hashlib.sha256(data).hexdigest() == f["sha256"]
                  print(("ok  " if ok else "BAD ") + f["url"])
                  assert ok, f["url"]
          PY
