name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The packs are fine
        run: python3 scripts/build_catalog.py --check
      - name: Tests
        run: python3 -m unittest discover scripts -v
